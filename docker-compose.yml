# Paid HTTPS tier stack: Caddy (front door, 80/443) -> internal Deno app, with
# RustFS as local S3 cert storage. The whole feature is gated by HTTPS_TIER_ENABLED
# (default false); with it off the stack serves the legacy HTTP redirects only.
#
#   docker compose up --build                      # flag off (legacy behavior)
#   HTTPS_TIER_ENABLED=true docker compose up --build   # paid HTTPS tier on

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    environment:
      FQDN: ${FQDN:-redirect.center}
      LISTEN_PORT: "3000"
      LISTEN_IP: 0.0.0.0
      LOGGER_LEVEL: ${LOGGER_LEVEL:-info}
      # Always behind Caddy in this stack -> trust X-Forwarded-For for the real client IP.
      TRUST_PROXY: "true"
      HTTPS_TIER_ENABLED: ${HTTPS_TIER_ENABLED:-false}
      # v2 durable store (ADR-0002): Postgres holds Plans + Domains.
      DATABASE_URL: ${DATABASE_URL:-postgres://redirect:redirect@postgres:5432/redirect}
      # v2 demo seed: plan blocks "customer|scope|cap|domain,domain;…"
      SEED_PLANS: ${SEED_PLANS:-}
      # Polar webhook (Phase 3/9) — signature secret + the per-Scope Tier ladders.
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:-}
      # The v1 single / whole-domain products are reused as each Scope's cap-1 Tier.
      POLAR_PRODUCT_SINGLE_ID: ${POLAR_PRODUCT_SINGLE_ID:-}
      POLAR_PRODUCT_WHOLE_DOMAIN_ID: ${POLAR_PRODUCT_WHOLE_DOMAIN_ID:-}
      # Larger bundles: "prodId:scope:cap,…" (e.g. the single "up to 5" Tier).
      POLAR_PRODUCT_TIERS: ${POLAR_PRODUCT_TIERS:-}
      # Polar hosted-checkout links per tier (Phase 5). The homepage HTTPS funnel
      # and the proxy's fallback page prefill these with the visitor's domain.
      POLAR_CHECKOUT_SINGLE_URL: ${POLAR_CHECKOUT_SINGLE_URL:-}
      POLAR_CHECKOUT_WHOLE_DOMAIN_URL: ${POLAR_CHECKOUT_WHOLE_DOMAIN_URL:-}
      # Polar API (Phase 6/9). `docker compose run --rm app deno task reconcile`
      # rebuilds the Postgres `plans` table from the provider (source of truth for Plans).
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      POLAR_API_BASE: ${POLAR_API_BASE:-https://api.polar.sh}
      # Dashboard auth (Phase 10, ADR-0003). Blank SESSION_SECRET => no dashboard
      # surface; magic-link email logs to console unless RESEND_API_KEY is set.
      SESSION_SECRET: ${SESSION_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # S3 cert storage (shared with Caddy) — Phase 4 deletes revoked certs here.
      S3_HOST: ${S3_HOST:-rustfs:9000}
      S3_BUCKET: ${S3_BUCKET:-redirect-center-certs}
      S3_ACCESS_ID: ${S3_ACCESS_ID:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PREFIX: ${S3_PREFIX:-certs}
      S3_INSECURE: ${S3_INSECURE:-true}
      # On-demand issuance rate limit (set low to watch it trigger in a sandbox).
      TLS_ISSUANCE_RATE_LIMIT: ${TLS_ISSUANCE_RATE_LIMIT:-20}
      TLS_ISSUANCE_RATE_WINDOW_MS: ${TLS_ISSUANCE_RATE_WINDOW_MS:-300000}
    expose:
      - "3000" # internal only — never published to the host
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    build:
      context: ./docker
      dockerfile: Dockerfile.caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      HTTPS_TIER_ENABLED: ${HTTPS_TIER_ENABLED:-false}
      S3_HOST: rustfs:9000
      S3_BUCKET: ${S3_BUCKET:-redirect-center-certs}
      S3_ACCESS_ID: ${S3_ACCESS_ID:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      S3_PREFIX: ${S3_PREFIX:-certs}
      S3_INSECURE: "true" # RustFS over plain HTTP in dev
      # Injected into the static fallback page (Phase 5) by Caddy's templates.
      FQDN: ${FQDN:-redirect.center}
      POLAR_CHECKOUT_SINGLE_URL: ${POLAR_CHECKOUT_SINGLE_URL:-}
      POLAR_CHECKOUT_WHOLE_DOMAIN_URL: ${POLAR_CHECKOUT_WHOLE_DOMAIN_URL:-}
    volumes:
      - ./docker/caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully
    restart: unless-stopped

  # RustFS runs as non-root UID 10001 and a fresh named volume is root-owned, so
  # chown it before RustFS starts. Keeps `docker compose up` working with nothing
  # on the host (no bind mount to chown manually).
  rustfs-init:
    image: busybox:latest
    command: ["sh", "-c", "mkdir -p /data && chown -R 10001:10001 /data"]
    volumes:
      - rustfs-data:/data

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
    ports:
      - "9000:9000" # S3 API (local debugging)
      - "9001:9001" # web console (local debugging)
    volumes:
      - rustfs-data:/data
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: create the cert bucket, then exit. Uses the AWS CLI as a vendor-
  # neutral S3 client (path-style, since the endpoint is a host:port, not a real
  # S3 DNS name). head-bucket verifies it exists so a failure blocks Caddy loudly.
  createbuckets:
    image: amazon/aws-cli:latest
    depends_on:
      rustfs:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_ID:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-redirect-center-certs}
    entrypoint:
      - /bin/sh
      - -c
      - |
        aws configure set default.s3.addressing_style path
        until aws --endpoint-url http://rustfs:9000 s3 ls >/dev/null 2>&1; do
          echo "waiting for rustfs..."; sleep 1;
        done
        aws --endpoint-url http://rustfs:9000 s3 mb "s3://$$S3_BUCKET" || true
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$S3_BUCKET"
        echo "bucket ready: $$S3_BUCKET"

  # v2 durable store (ADR-0002): Plans + Domains. On-box single-instance; recovery
  # via pg_dump -> S3 (Phase 12). Domains are a source of truth, not a cache.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: redirect
      POSTGRES_PASSWORD: redirect
      POSTGRES_DB: redirect
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redirect -d redirect"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  rustfs-data:
  postgres-data:
