# Paid HTTPS tier stack: Caddy (front door, 80/443) -> internal Deno app, with
# MinIO as local S3 cert storage. The whole feature is gated by HTTPS_TIER_ENABLED
# (default false); with it off the stack serves the legacy HTTP redirects only.
#
#   docker compose up --build                      # flag off (legacy behavior)
#   HTTPS_TIER_ENABLED=true docker compose up --build   # paid HTTPS tier on

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    environment:
      FQDN: ${FQDN:-redirect.center}
      LISTEN_PORT: "3000"
      LISTEN_IP: 0.0.0.0
      LOGGER_LEVEL: ${LOGGER_LEVEL:-info}
      # Always behind Caddy in this stack -> trust X-Forwarded-For for the real client IP.
      TRUST_PROXY: "true"
      HTTPS_TIER_ENABLED: ${HTTPS_TIER_ENABLED:-false}
      # SQLite subscription cache on a volume so it survives container restarts.
      SUBSCRIPTIONS_DB_PATH: /data/subscriptions.db
      # Demo seed (manual subscriptions); webhooks (Phase 3) upsert real ones.
      # Format: "domain:scope,domain:scope" (scope = single | whole-domain).
      SEED_SUBSCRIPTIONS: ${SEED_SUBSCRIPTIONS:-paid-test.redirect.center:single}
      # Polar webhook (Phase 3) — signature secret, product->scope ids, field slug.
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:-}
      POLAR_PRODUCT_SINGLE_ID: ${POLAR_PRODUCT_SINGLE_ID:-}
      POLAR_PRODUCT_WHOLE_DOMAIN_ID: ${POLAR_PRODUCT_WHOLE_DOMAIN_ID:-}
      POLAR_DOMAIN_FIELD_SLUG: ${POLAR_DOMAIN_FIELD_SLUG:-domain}
      # Polar hosted-checkout links per tier (Phase 5). The homepage HTTPS funnel
      # and the proxy's fallback page prefill these with the visitor's domain.
      POLAR_CHECKOUT_SINGLE_URL: ${POLAR_CHECKOUT_SINGLE_URL:-}
      POLAR_CHECKOUT_WHOLE_DOMAIN_URL: ${POLAR_CHECKOUT_WHOLE_DOMAIN_URL:-}
      # S3 cert storage (shared with Caddy) — Phase 4 deletes revoked certs here.
      S3_HOST: ${S3_HOST:-minio:9000}
      S3_BUCKET: ${S3_BUCKET:-redirect-center-certs}
      S3_ACCESS_ID: ${S3_ACCESS_ID:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_PREFIX: ${S3_PREFIX:-certs}
      S3_INSECURE: ${S3_INSECURE:-true}
    expose:
      - "3000" # internal only — never published to the host
    volumes:
      - app-data:/data
    restart: unless-stopped

  caddy:
    build:
      context: ./docker
      dockerfile: Dockerfile.caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      HTTPS_TIER_ENABLED: ${HTTPS_TIER_ENABLED:-false}
      S3_HOST: minio:9000
      S3_BUCKET: ${S3_BUCKET:-redirect-center-certs}
      S3_ACCESS_ID: ${S3_ACCESS_ID:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_PREFIX: ${S3_PREFIX:-certs}
      S3_INSECURE: "true" # MinIO over plain HTTP in dev
      # Injected into the static fallback page (Phase 5) by Caddy's templates.
      FQDN: ${FQDN:-redirect.center}
      POLAR_CHECKOUT_SINGLE_URL: ${POLAR_CHECKOUT_SINGLE_URL:-}
      POLAR_CHECKOUT_WHOLE_DOMAIN_URL: ${POLAR_CHECKOUT_WHOLE_DOMAIN_URL:-}
    volumes:
      - ./docker/caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000" # S3 API (local debugging)
      - "9001:9001" # web console (local debugging)
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # One-shot: create the cert bucket, then exit.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    environment:
      S3_BUCKET: ${S3_BUCKET:-redirect-center-certs}
      S3_ACCESS_ID: ${S3_ACCESS_ID:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$S3_ACCESS_ID" "$$S3_SECRET_KEY"; do
          echo "waiting for minio..."; sleep 1;
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        echo "bucket ready: $$S3_BUCKET"

volumes:
  app-data:
  caddy-data:
  caddy-config:
  minio-data:
