# Production stack for the paid HTTPS tier (Phase 7). Self-contained — run it
# directly, not as an override of docker-compose.yml:
#
#   cp docker/prod.env.example docker/prod.env   # then fill in real values
#   docker compose --env-file docker/prod.env -f docker-compose.prod.yml up -d --build
#
# Differences from the dev docker-compose.yml:
#   - certs persist to a real, private, server-side-encrypted S3 bucket (no RustFS);
#   - Caddy issues from Let's Encrypt (staging by default, flip to prod once
#     validated) instead of its internal CA.
#
# Required secrets fail loud (${VAR:?...}) if unset, so a half-configured box
# never boots silently. With HTTPS_TIER_ENABLED=false the stack is byte-for-byte
# the legacy HTTP redirect service (Caddy serves Caddyfile.off).

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    environment:
      FQDN: ${FQDN:-redirect.center}
      LISTEN_PORT: "3000"
      LISTEN_IP: 0.0.0.0
      LOGGER_LEVEL: ${LOGGER_LEVEL:-info}
      TRUST_PROXY: "true"
      HTTPS_TIER_ENABLED: ${HTTPS_TIER_ENABLED:-true}
      # v2 durable store (ADR-0002): on-box Postgres holds Plans + Domains.
      DATABASE_URL: ${DATABASE_URL:-postgres://redirect:redirect@postgres:5432/redirect}
      # No demo seed in prod — Plans come from webhooks + `deno task reconcile`.
      SEED_PLANS: ""
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:?set POLAR_WEBHOOK_SECRET}
      # The v1 single / whole-domain products are reused as each Scope's cap-1 Tier.
      POLAR_PRODUCT_SINGLE_ID: ${POLAR_PRODUCT_SINGLE_ID:?set POLAR_PRODUCT_SINGLE_ID}
      POLAR_PRODUCT_WHOLE_DOMAIN_ID: ${POLAR_PRODUCT_WHOLE_DOMAIN_ID:?set POLAR_PRODUCT_WHOLE_DOMAIN_ID}
      # Larger bundles: "prodId:scope:cap,…" (e.g. the single "up to 5" Tier).
      POLAR_PRODUCT_TIERS: ${POLAR_PRODUCT_TIERS:-}
      POLAR_CHECKOUT_SINGLE_URL: ${POLAR_CHECKOUT_SINGLE_URL:?set POLAR_CHECKOUT_SINGLE_URL}
      POLAR_CHECKOUT_WHOLE_DOMAIN_URL: ${POLAR_CHECKOUT_WHOLE_DOMAIN_URL:?set POLAR_CHECKOUT_WHOLE_DOMAIN_URL}
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:?set POLAR_ACCESS_TOKEN}
      POLAR_API_BASE: ${POLAR_API_BASE:-https://api.polar.sh}
      # Dashboard auth (Phase 10, ADR-0003). Blank SESSION_SECRET => no dashboard
      # surface; otherwise /login + /portal mount and login resolves the Customer
      # via POLAR_ACCESS_TOKEN. Magic-link email logs to console unless RESEND set.
      SESSION_SECRET: ${SESSION_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL:-https://redirect.center}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Real S3 cert storage (shared with Caddy). The app deletes a revoked
      # domain's cert objects here on revoke (Phase 4).
      S3_HOST: ${S3_HOST:?set S3_HOST (e.g. s3.us-east-1.amazonaws.com)}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_ACCESS_ID: ${S3_ACCESS_ID:?set S3_ACCESS_ID}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:?set S3_REGION (must match the bucket's region)}
      S3_PREFIX: ${S3_PREFIX:-certs}
      S3_INSECURE: "false"
    expose:
      - "3000" # internal only — never published to the host
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # v2 durable store (ADR-0002): Plans + Domains. On-box single-instance.
  # Disaster recovery = the pg-backup service below (pg_dump -> S3). Losing this
  # volume WITHOUT a recent dump loses the app-owned Domain list (Plans rebuild
  # from Polar via `deno task reconcile`; certs already persist in S3).
  postgres:
    image: postgres:16-alpine
    environment:
      # Internal-only (never published to the host). Override together with
      # DATABASE_URL via prod.env if you want non-default credentials.
      POSTGRES_USER: ${POSTGRES_USER:-redirect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-redirect}
      POSTGRES_DB: ${POSTGRES_DB:-redirect}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-redirect} -d ${POSTGRES_DB:-redirect}"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  caddy:
    build:
      context: ./docker
      dockerfile: Dockerfile.caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      HTTPS_TIER_ENABLED: ${HTTPS_TIER_ENABLED:-true}
      # Let's Encrypt account email (required for a real ACME issuer).
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      # Issuer: staging by default; flip to the production directory once a real
      # domain has validated end-to-end (see README "Production cutover").
      CADDY_TLS_ISSUER: ${CADDY_TLS_ISSUER:-acme_ca https://acme-staging-v02.api.letsencrypt.org/directory}
      S3_HOST: ${S3_HOST:?set S3_HOST}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_ACCESS_ID: ${S3_ACCESS_ID:?set S3_ACCESS_ID}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_PREFIX: ${S3_PREFIX:-certs}
      S3_INSECURE: "false"
      FQDN: ${FQDN:-redirect.center}
      POLAR_CHECKOUT_SINGLE_URL: ${POLAR_CHECKOUT_SINGLE_URL:?set POLAR_CHECKOUT_SINGLE_URL}
      POLAR_CHECKOUT_WHOLE_DOMAIN_URL: ${POLAR_CHECKOUT_WHOLE_DOMAIN_URL:?set POLAR_CHECKOUT_WHOLE_DOMAIN_URL}
    volumes:
      - ./docker/caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  # Phase 12 durability: on-demand pg_dump -> the real S3 bucket (ADR-0002). Under
  # the "backup" profile so it never starts on a normal `up`. Schedule from the
  # host (daily cron):
  #   docker compose --env-file docker/prod.env -f docker-compose.prod.yml run --rm pg-backup
  pg-backup:
    profiles: ["backup"]
    build:
      context: ./docker
      dockerfile: Dockerfile.backup
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://redirect:redirect@postgres:5432/redirect}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_BACKUP_PREFIX: ${S3_BACKUP_PREFIX:-backups}
      # Real AWS S3 by default (no endpoint override). Set S3_ENDPOINT_URL only for
      # an S3-compatible non-AWS endpoint.
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_ID:?set S3_ACCESS_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:?set S3_REGION}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
